[package]
name = "sensecare-api"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bigdecimal = { version = "0.4.10", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
deadpool = "0.13.1"
diesel = { version = "2.3.13", features = ["postgres_backend", "uuid", "chrono", "numeric", "serde_json"] }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool", "async-connection-wrapper"] }
diesel_migrations = "2.3.2"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
