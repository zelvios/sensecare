name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sensecare
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: postgres
        ports: [ "5433:5432" ]
        options: --health-cmd "pg_isready -U sensecare" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://sensecare:change-me@localhost:5433/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    env:
      BOOTSTRAP_ADMIN_PASSWORD: admin-change-me
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Build the API image with a layer cache, so the Rust build is only slow when deps change.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/bake-action@v5
        with:
          source: .
          files: docker-compose.yml
          targets: api
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - run: cp .env.example .env && docker compose up -d --wait db api
        working-directory: .

      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
        env:
          E2E_API_URL: http://localhost:8080
          E2E_ADMIN_PASSWORD: ${{ env.BOOTSTRAP_ADMIN_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ backend, frontend, e2e ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Pull and restart on the server
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy "$USER@$HOST" '
            set -e
            cd /root/sensecare
            git pull --ff-only
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate caddy
            docker image prune -f
          '
