name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sensecare
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: postgres
        ports: [ "5433:5432" ]
        options: --health-cmd "pg_isready -U sensecare" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://sensecare:change-me@localhost:5433/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    env:
      BOOTSTRAP_ADMIN_PASSWORD: admin-change-me
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Build the API image with a layer cache, so the Rust build is only slow when deps change.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/bake-action@v5
        with:
          source: .
          files: docker-compose.yml
          targets: api
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - run: cp .env.example .env && docker compose up -d --wait db api
        working-directory: .

      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
        env:
          E2E_API_URL: http://localhost:8080
          E2E_ADMIN_PASSWORD: ${{ env.BOOTSTRAP_ADMIN_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
