name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Conventional Branch naming
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(feature|bugfix|hotfix|release|chore|docs)/[a-z0-9._-]+$'
          if [[ "$BRANCH" =~ $pattern ]]; then
            echo "OK: $BRANCH"
          else
            echo "::error::Branch '$BRANCH' must match $pattern"
            echo "Examples: feature/device-ingest, bugfix/session-expiry, chore/ci-cache"
            exit 1
          fi

  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: Subject must start with a lowercase letter.

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .github/.commitlintrc.json
